name: Reusable - Hello
on:
  workflow_call:
    inputs:
      max_turns:
        required: false
        type: number
        default: 30
      model:
        required: false
        type: string
        default: "claude-fable-5"
      fallback_model:
        required: false
        type: string
        default: "claude-sonnet-5"

jobs:
  hello:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - run: echo "model=${{ inputs.model }} fallback=${{ inputs.fallback_model }} turns=${{ inputs.max_turns }}"
