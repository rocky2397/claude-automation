name: Reusable - Claude Worker

on:
  workflow_call:
    inputs:
      max_turns:
        required: false
        type: number
        # The prompt below asks for implement, test, run the suite, open a
        # PR, then watch CI with up to two fix cycles. Thirty turns cannot
        # cover that: a NormChat run died at turn 31 having spent $5.90 and
        # produced nothing, and the two issues that failed were the two
        # substantial ones. Raise the cap to match the work requested.
        default: 60
      model:
        required: false
        type: string
        default: "claude-fable-5"
      fallback_model:
        required: false
        type: string
        # The worker writes code and opens PRs, so when the primary model is
        # unavailable the better failure is slower and dearer, not weaker.
        default: "claude-opus-5"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: claude-worker-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event_name == 'issues' && github.event.label.name == 'claude-work'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Implement with Claude
        id: implement
        uses: anthropics/claude-code-action@v1
        env:
          # gh CLI inside Claude's Bash needs a token; the job token has
          # contents/issues/pull-requests write from the caller.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implement issue #${{ github.event.issue.number }}:
            "${{ github.event.issue.title }}"

            Requirements:
            - Follow CLAUDE.md conventions strictly, including the path
              denylist (never modify .github/workflows/, infra/, or
              migrations/).
            - Make the minimal change that fully resolves the issue.
            - Write or update tests for the change.
            - Run the test suite. Do not open a PR if tests fail;
              instead comment on the issue with the failure.
            - Open a PR titled "fix: <issue title> (#N)" that closes
              the issue, with a summary of the approach and any
              tradeoffs.
            - After opening the PR, wait for its CI checks to finish
              with `gh pr checks <PR> --watch`. If a check fails, read
              the failing job's log, fix the underlying issue, and
              push an update to the same PR branch, then watch CI
              again. Allow at most 2 fix attempts (3 CI runs total
              including the first).
            - If CI is still failing after that cap, stop — do not
              remove the "claude-work" label. Instead comment on the
              PR with the failing check's output and a summary of what
              was tried, and leave the issue as-is for human
              follow-up.
            - Only once CI is green: remove the "claude-work" label
              and add "in-review".
          # --allowedTools is an allowlist that REPLACES the default tool
          # set, not an addition to it. Listing only Bash(...) patterns here
          # silently removed Read/Write/Edit, so the worker could not edit a
          # single file and every run died on permission denials. Any new
          # entry must keep the native file tools listed first.
          #
          # Bash is also disallowed by default in CI; without the whitelist
          # the worker cannot commit, push, test, or open the PR.
          #
          # The read-only inspection commands stay even though Read and Grep
          # are back, because a denial still costs a turn: one NormChat run
          # spent 6 of its 31 turns on blocked calls before hitting the cap,
          # and Claude reaches for the shell equivalents regardless. They
          # cannot modify the checkout. Commands that can (rm, mv, cp, chmod)
          # are deliberately still absent.
          claude_args: |
            --max-turns ${{ inputs.max_turns }}
            --model ${{ inputs.model }}
            --fallback-model ${{ inputs.fallback_model }}
            --allowedTools "Read,Write,Edit,Glob,Grep,TodoWrite,Bash(git:*),Bash(gh:*),Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python:*),Bash(python3:*),Bash(pytest:*),Bash(pip:*),Bash(pip3:*),Bash(cd:*),Bash(ls:*),Bash(mkdir:*),Bash(grep:*),Bash(rg:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(find:*),Bash(wc:*),Bash(sed:*),Bash(awk:*),Bash(diff:*),Bash(sort:*),Bash(uniq:*),Bash(echo:*),Bash(pwd:*)"

      # Always runs, including when Claude failed. Records what the worker
      # actually produced, so a green-but-empty run is visible in the log.
      - name: Emit run log
        if: always()
        env:
          STAGE: work
          JOB_STATUS: ${{ job.status }}
          CLAUDE_STEP: ${{ steps.implement.outcome }}
          CLAUDE_EXEC_FILE: ${{ steps.implement.outputs.execution_file }}
          MODEL: ${{ inputs.model }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The worker's real output is a PR, so look for one rather than
          # trusting the exit code.
          PR=$(gh pr list --state all --search "${ISSUE} in:body" \
                 --json number,url,state,createdAt --limit 5 2>/dev/null \
               | jq -c '[.[]]' ) || PR='[]'
          PR_URL=$(echo "$PR" | jq -r '.[0].url // empty')
          LABELS=$(gh issue view "$ISSUE" --json labels \
                   --jq '[.labels[].name] | join(",")' 2>/dev/null) || LABELS=""

          if [ "$JOB_STATUS" = "success" ] && [ -n "$PR_URL" ]; then
            OUTCOME="pr_opened"
            DETAIL="$PR_URL (issue labels: ${LABELS:-none})"
          elif [ -n "$PR_URL" ]; then
            OUTCOME="pr_opened_but_job_failed"
            DETAIL="$PR_URL (issue labels: ${LABELS:-none})"
          elif [ "$JOB_STATUS" = "success" ]; then
            OUTCOME="no_pr"
            DETAIL="job was green but no PR references issue #$ISSUE (labels: ${LABELS:-none})"
          else
            OUTCOME="error"
            DETAIL="worker failed with no PR for issue #$ISSUE (labels: ${LABELS:-none})"
          fi
          export OUTCOME DETAIL

          set -uo pipefail
          mkdir -p _automation_log

          # The action writes a full SDK message log even when show_full_output
          # is off, so this captures the real error without spraying secrets
          # into the public run log.
          EXEC="${CLAUDE_EXEC_FILE:-}"
          if [ -z "$EXEC" ] || [ ! -f "$EXEC" ]; then
            EXEC="$RUNNER_TEMP/claude-execution-output.json"
          fi
          RESULT='{}'
          if [ -f "$EXEC" ]; then
            cp "$EXEC" _automation_log/claude-execution.json || true
            RESULT=$(jq -c '(if type=="array" then . else [.] end)
                            | map(select(.type=="result")) | last // {}' \
                     "$EXEC" 2>/dev/null) || RESULT='{}'
            [ -n "$RESULT" ] || RESULT='{}'
          fi

          jq -n \
            --arg ts        "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo      "$GITHUB_REPOSITORY" \
            --arg stage     "$STAGE" \
            --arg run_id    "$GITHUB_RUN_ID" \
            --arg attempt   "$GITHUB_RUN_ATTEMPT" \
            --arg run_url   "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg trigger   "$GITHUB_EVENT_NAME" \
            --arg job       "$JOB_STATUS" \
            --arg step      "${CLAUDE_STEP:-}" \
            --arg model     "${MODEL:-}" \
            --arg outcome   "$OUTCOME" \
            --arg detail    "$DETAIL" \
            --arg issue     "${ISSUE:-}" \
            --argjson r     "$RESULT" \
            '{ts:$ts, repo:$repo, stage:$stage, outcome:$outcome, detail:$detail,
              issue:(if $issue=="" then null else ($issue|tonumber? // null) end),
              job_status:$job, claude_step:$step, trigger:$trigger, model:$model,
              run_id:$run_id, attempt:$attempt, run_url:$run_url,
              claude:{ran:($r|has("subtype")),
                      is_error:($r.is_error // null),
                      subtype:($r.subtype // null),
                      num_turns:($r.num_turns // null),
                      duration_ms:($r.duration_ms // null),
                      permission_denials:($r.permission_denials_count // null),
                      result_text:($r.result // null)}}' \
            > _automation_log/event.json

          {
            echo "### Automation log — \`$STAGE\`"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| outcome | \`$OUTCOME\` |"
            echo "| detail | $DETAIL |"
            echo "| job status | $JOB_STATUS |"
            echo "| claude step | ${CLAUDE_STEP:-n/a} |"
            jq -r '.claude | to_entries[]
                   | select(.value != null)
                   | "| claude." + .key + " | " + (.value|tostring|.[0:300]) + " |"' \
              _automation_log/event.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-log-work-${{ github.run_id }}-${{ github.run_attempt }}
          path: _automation_log/
          retention-days: 90
          if-no-files-found: warn
