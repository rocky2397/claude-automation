name: Claude Automation
on:
  schedule:
    - cron: "0 7,13 * * 1-5"   # 07:00 and 13:00 UTC, weekdays
  workflow_dispatch: {}
  issues:
    types: [labeled]

jobs:
  prioritize:
    if: github.event_name != 'issues'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: your-user/claude-automation/.github/workflows/reusable-prioritizer.yml@main
    with:
      project_number: ${{ fromJSON(vars.PROJECT_NUMBER) }}
      project_owner: your-user-or-org
      owner_type: user   # or "organization"
      wip_limit: 1
      # model defaults to claude-fable-5 with claude-sonnet-5 as fallback;
      # override here if a project needs something else:
      # model: claude-fable-5
      # fallback_model: claude-sonnet-5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}

  work:
    if: github.event_name == 'issues' && github.event.label.name == 'claude-work'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: your-user/claude-automation/.github/workflows/reusable-worker.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
